<title>BROT2YOU Studio — la fabrique de jeux de classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#151d65; --ink2:#3b4290; --pink:#fc6589; --sun:#ffcf61; --sky:#52c7fa; --mint:#4fd39a; --grape:#8a5cf6; --paper:#f3f5ff; --line:#dde1f7; --white:#fff;
  --good:#22b07d; --bad:#ef4f5f;
  --disp:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
img{max-width:100%}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:30}
.top a.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--pink),#ff9a62);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:20px;box-shadow:0 3px 0 #b8335a}
.brandname{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1}
.brandname small{display:block;font-family:var(--body);font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.top nav{margin-left:auto;display:flex;gap:6px}
.top nav a{color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap}
.top nav a.on,.top nav a:hover{background:rgba(255,255,255,.14)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
h1,h2,h3{font-family:var(--disp);line-height:1.1;margin:0}
h1{font-size:34px;font-weight:800}
h2{font-size:24px;font-weight:800}
.muted{color:#6a70a3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line),0 0 0 2px var(--line) inset;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line) inset}
.btn.main{background:var(--pink);color:#fff;box-shadow:0 4px 0 #c23a62}
.btn.main:active{box-shadow:0 1px 0 #c23a62}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0a0f3d}
.btn.go{background:var(--mint);color:#06392a;box-shadow:0 4px 0 #23a070}
.btn.small{padding:7px 12px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:11px;border:0;background:#fff;box-shadow:0 0 0 2px var(--line) inset;display:inline-grid;place-items:center;font-size:17px;flex:none}
.iconbtn.on{background:var(--ink);color:#fff;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* HOME */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:center;background:var(--ink);color:#fff;border-radius:26px;padding:30px 34px;position:relative;overflow:hidden}
.hero h1{font-size:44px}
.hero p{font-size:18px;opacity:.85;max-width:46ch;margin:10px 0 20px}
.hero .shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hero .shelf img,.hero .shelf span{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));transition:transform .25s}
.hero .shelf img:hover{transform:rotate(-6deg) scale(1.08)}
.libhead{display:flex;align-items:end;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.search{border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;min-width:220px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.act{background:#fff;border-radius:18px;padding:14px;box-shadow:0 0 0 2px var(--line) inset;display:flex;flex-direction:column;gap:10px;position:relative}
.act .thumb{display:flex;gap:12px;align-items:center;cursor:pointer}
.act .thumb img,.act .thumb .emo{width:58px;height:58px;flex:none;object-fit:contain;font-size:40px;display:grid;place-items:center}
.act h3{font-size:19px;font-weight:700;word-break:break-word}
.act .meta{font-size:13px;color:#6a70a3}
.act .acts{display:flex;gap:6px;margin-top:auto}
.empty{border:3px dashed var(--line);border-radius:20px;padding:40px;text-align:center;color:#6a70a3}

/* CHOOSE */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:18px}
.tcard{border:0;background:#fff;border-radius:18px;padding:14px 12px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;box-shadow:0 0 0 2px var(--line) inset;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-4px);box-shadow:0 0 0 3px var(--pink) inset,0 10px 20px rgba(21,29,101,.12)}
.tcard img,.tcard .emo{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 6px;font-size:58px;line-height:84px}
.tcard b{font-family:var(--disp);font-size:19px;display:block}
.tcard span{font-size:13px;color:#6a70a3;display:block;margin-top:2px}
.tcard .typ{display:inline-block;margin-top:auto;position:relative;top:8px;margin-bottom:8px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--ink2)}

/* EDITOR */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;margin-top:16px}
.panel{background:#fff;border-radius:20px;box-shadow:0 0 0 2px var(--line) inset;padding:20px}
.titlein{width:100%;font-family:var(--disp);font-size:28px;font-weight:800;border:0;border-bottom:3px solid var(--line);padding:4px 2px;background:transparent;color:var(--ink)}
.titlein:focus{outline:none;border-color:var(--pink)}
.field{border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;width:100%;min-width:0}
.field:focus{outline:none;border-color:var(--sky)}
textarea.field{resize:vertical;min-height:90px}
.erow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.erow .num{font-family:var(--disp);font-weight:800;font-size:18px;color:#9aa0cf;padding-top:8px;text-align:center}
.cell{display:flex;gap:6px;align-items:center;min-width:0}
.cell .thumbimg{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--line)}
.colhead{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 150px;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#6a70a3;padding:0 0 4px}
.qblock{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.qans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ansline{display:flex;gap:6px;align-items:center}
.okbtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;font-weight:800;color:#c3c7e6}
.okbtn.on{background:var(--good);border-color:var(--good);color:#fff}
.gcol{border:2px solid var(--line);border-radius:16px;padding:12px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.side h3{font-size:18px;margin-bottom:8px}
.side p{font-size:14px;margin:0 0 10px}
.tip{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px}
.tip code{background:#fff;border-radius:6px;padding:1px 5px}
.dgwrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.dgwrap img{display:block;max-height:460px}
.dgpin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--pink);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.3)}

/* PLAY LAYOUT */
.play{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;margin-top:12px}
.playhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.playhead h1{font-size:28px}
.rail{display:flex;flex-direction:column;gap:14px}
.rail .panel{padding:14px}
.rail h3{font-size:17px;margin-bottom:8px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:420px;overflow:auto;padding:2px}
.tbtn{border:0;background:var(--paper);border-radius:12px;padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;line-height:1.15;text-align:center}
.tbtn img,.tbtn .emo{width:40px;height:40px;object-fit:contain;font-size:30px;line-height:40px}
.tbtn.on{background:var(--ink);color:#fff}
.tbtn.off{opacity:.35;cursor:not-allowed}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0}
.opt select{border:2px solid var(--line);border-radius:9px;padding:4px 6px;background:#fff}
.toggle{width:44px;height:26px;border-radius:999px;background:#d3d7ef;border:0;position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--mint)}
.toggle.on::after{left:21px}

/* STAGE + THEMES */
.stage{--bg:#151d65;--dot:rgba(255,255,255,.07);--fg:#fff;--tile:#fff;--tileInk:#151d65;--edge:#c9cdf0;--soft:rgba(255,255,255,.12);
  position:relative;border-radius:24px;overflow:hidden;background:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;color:var(--fg);min-height:min(72vh,640px);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.stage.t-craie{--bg:#24473b;--dot:rgba(255,255,255,.05);--fg:#f4f1e4;--tile:#f6f3e6;--tileInk:#24473b;--edge:#b8b39a;--soft:rgba(255,255,255,.1)}
.stage.t-bonbon{--bg:#ffd9ea;--dot:rgba(255,255,255,.7);--fg:#5b2a6e;--tile:#fff;--tileInk:#5b2a6e;--edge:#f0a9cd;--soft:rgba(91,42,110,.08)}
.stage.t-ocean{--bg:#0b6f8c;--dot:rgba(255,255,255,.08);--fg:#fff;--tile:#fff;--tileInk:#0b4f66;--edge:#9fd3e3;--soft:rgba(255,255,255,.13)}
.stage.t-papier{--bg:#eef1ff;--dot:rgba(21,29,101,.08);--fg:#151d65;--tile:#fff;--tileInk:#151d65;--edge:#cfd4f3;--soft:rgba(21,29,101,.06)}
.stage.t-nuit{--bg:#1b1030;--dot:rgba(255,90,200,.12);--fg:#fff;--tile:#2b1b4d;--tileInk:#fff;--edge:#ff4fb8;--soft:rgba(255,255,255,.08)}
.stage.full{position:fixed;inset:0;border-radius:0;z-index:100;min-height:100%}
.hud{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.pill{background:var(--soft);border-radius:999px;padding:5px 13px;font-family:var(--disp);font-weight:700;font-size:17px;white-space:nowrap}
.pill:empty{display:none}
.pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hud .sbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--soft);color:var(--fg);font-size:16px;display:grid;place-items:center}
.hud .sbtn.mute{opacity:.5}
.prog{flex:1;min-width:80px;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sun);border-radius:99px;transition:width .35s}
.arena{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 18px 22px;gap:14px;min-height:0}
.gtitle{font-family:var(--disp);font-weight:800;font-size:clamp(20px,3vw,30px);text-align:center;line-height:1.15;max-width:900px}

/* TILE PRIMITIVE */
.tile{border:0;border-radius:16px;background:var(--tile);color:var(--tileInk);box-shadow:0 6px 0 var(--edge);font-family:var(--disp);font-weight:700;font-size:clamp(16px,2.1vw,24px);padding:12px 14px;line-height:1.15;transition:transform .1s,box-shadow .1s,background .2s,opacity .3s;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;word-break:break-word}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.tile img{max-height:90px;border-radius:10px}
.c0{--tile:#ff6f91;--edge:#c73c62;--tileInk:#fff}.c1{--tile:#3fb4f0;--edge:#1f7fb8;--tileInk:#fff}.c2{--tile:#ffc23d;--edge:#cf8d0a;--tileInk:#3b2a00}.c3{--tile:#3cc98a;--edge:#1f9061;--tileInk:#fff}.c4{--tile:#9b6bff;--edge:#6a3ed6;--tileInk:#fff}.c5{--tile:#ff8a4c;--edge:#c95a1f;--tileInk:#fff}
.tile.good{--tile:#22b07d;--edge:#13744f;--tileInk:#fff;animation:pop .35s}
.tile.bad{--tile:#ef4f5f;--edge:#a8283a;--tileInk:#fff;animation:shake .4s}
.tile.sel{outline:4px solid var(--sun);outline-offset:2px}
.tile.gone{opacity:0;transform:scale(.5);pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
@keyframes rise{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .4s}
.spk{border:0;background:var(--soft);color:inherit;border-radius:50%;width:38px;height:38px;font-size:17px;flex:none;display:inline-grid;place-items:center}
.tile .spk{background:rgba(0,0,0,.08)}

/* POPUP + RESULTS */
.pop{position:absolute;inset:0;background:rgba(10,14,50,.55);display:grid;place-items:center;z-index:20;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.popcard{background:#fff;color:#151d65;border-radius:26px;padding:26px 26px 20px;max-width:640px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.18);animation:rise .3s cubic-bezier(.2,1.4,.4,1);max-height:100%;overflow:auto}
.popcard .big{font-family:var(--disp);font-weight:800;font-size:clamp(28px,5vw,52px);line-height:1.08;margin:6px 0 10px;word-break:break-word}
.popcard .ans{font-family:var(--disp);font-size:clamp(20px,3vw,30px);color:#22b07d;font-weight:700;margin:6px 0}
.popcard img{max-height:220px;border-radius:14px;margin:4px auto}
.popcard .row{justify-content:center;margin-top:16px}
.stars{font-size:54px;letter-spacing:6px;line-height:1}
.stars i{font-style:normal;display:inline-block;animation:rise .4s both;color:#ffc23d}
.stars i.off{color:#dfe2f5}
.review{text-align:left;font-size:14px;max-height:220px;overflow:auto;margin-top:12px;border-top:2px solid #eef0fb;padding-top:8px}
.review div{padding:4px 0;border-bottom:1px dashed #eef0fb}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:30}

/* WHEEL */
.wheelbox{position:relative;flex:1;width:100%;display:grid;place-items:center;min-height:300px;contain:layout}
.wheelbox canvas{display:block;cursor:pointer;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.wpointer{position:absolute;width:44px;height:56px;left:50%;margin-left:-22px;transform-origin:50% 20%;z-index:2}
.wpointer svg{display:block;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
.wpointer.flick{animation:flick .12s}
@keyframes flick{50%{transform:rotate(-22deg)}}
.wcenter{position:absolute;width:92px;height:92px;border-radius:50%;border:0;background:#fff;color:#151d65;font-family:var(--disp);font-weight:800;font-size:19px;box-shadow:0 5px 0 #c9cdf0,0 0 0 6px rgba(255,255,255,.35);z-index:2}
.wcenter:active{transform:translateY(3px);box-shadow:0 2px 0 #c9cdf0}

/* CARDS / FLIP */
.flipper{perspective:1400px}
.flipper .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flipper.flipped .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;gap:10px}
.face.back{transform:rotateY(180deg)}
.cardback{background:repeating-linear-gradient(45deg,#ff6f91 0 14px,#ff83a1 14px 28px);box-shadow:0 0 0 8px #fff inset,0 8px 0 rgba(0,0,0,.2);color:#fff;font-family:var(--disp);font-weight:800;font-size:28px}
.cardback b{background:#fff;color:#ff6f91;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-size:34px}
.cardfront{background:var(--tile);color:var(--tileInk);box-shadow:0 8px 0 var(--edge)}
.cardfront .txt{font-family:var(--disp);font-weight:800;font-size:clamp(24px,4vw,46px);line-height:1.1;word-break:break-word}
.cardfront .sub{font-family:var(--disp);font-size:clamp(17px,2.4vw,26px);color:#22b07d;font-weight:700}
.cardfront img{max-height:45%;border-radius:12px}
.bigcard{width:min(520px,86vw);height:min(330px,46vh)}
.deal{animation:deal .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes deal{from{transform:translate(-60%,10%) rotate(-12deg) scale(.7);opacity:.2}}
.decks{display:flex;align-items:center;gap:30px;flex-wrap:wrap;justify-content:center}
.pile{width:110px;height:150px;position:relative}
.pile i{position:absolute;inset:0;border-radius:14px;background:repeating-linear-gradient(45deg,#ff6f91 0 8px,#ff83a1 8px 16px);box-shadow:0 0 0 5px #fff inset,0 4px 0 rgba(0,0,0,.2)}

/* GRID OF BOXES / TILES / MEMORY */
.bgrid{display:grid;gap:14px;width:100%;max-width:980px}
.boxt{position:relative;aspect-ratio:1.15;border:0;padding:0;background:none}
.boxt .body{position:absolute;left:6%;right:6%;bottom:0;top:28%;border-radius:12px;background:var(--tile);box-shadow:0 6px 0 var(--edge);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:clamp(20px,3vw,34px);color:var(--tileInk)}
.boxt .body::after{content:'';position:absolute;left:44%;right:44%;top:0;bottom:0;background:rgba(255,255,255,.45)}
.boxt .lid{position:absolute;left:0;right:0;top:14%;height:22%;border-radius:10px;background:var(--tile);box-shadow:0 5px 0 var(--edge);filter:brightness(1.08);transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .45s;z-index:1}
.boxt .lid::after{content:'';position:absolute;left:43%;right:43%;top:0;bottom:0;background:rgba(255,255,255,.5)}
.boxt .bow{position:absolute;top:2%;left:50%;width:34%;margin-left:-17%;height:16%;z-index:2;transition:transform .45s,opacity .45s}
.boxt .bow::before,.boxt .bow::after{content:'';position:absolute;bottom:0;width:48%;height:100%;border-radius:50% 50% 10% 50%;border:5px solid rgba(255,255,255,.75)}
.boxt .bow::before{left:0}.boxt .bow::after{right:0;transform:scaleX(-1)}
.boxt:hover .lid{transform:translateY(-6px) rotate(-3deg)}
.boxt.open .lid{transform:translate(30%,-90%) rotate(35deg);opacity:0}
.boxt.open .bow{transform:translateY(-120%);opacity:0}
.boxt.open .body{filter:grayscale(.6);opacity:.55;font-size:clamp(12px,1.4vw,16px);padding:6px;line-height:1.1}
.mgrid{display:grid;gap:12px;width:100%;max-width:960px}
.mcard{aspect-ratio:1.05;border:0;padding:0;background:none}
.mcard .face{border-radius:16px;padding:8px}
.mcard .cardback{box-shadow:0 0 0 6px #fff inset,0 6px 0 rgba(0,0,0,.2);font-size:28px}
.mcard .cardfront .txt{font-size:clamp(14px,2vw,24px)}
.mcard .cardfront img{max-height:70%}
.mcard.done .cardfront{--tile:#22b07d;--edge:#13744f;--tileInk:#fff;animation:pop .4s}
.mcard.done{pointer-events:none}

/* MATCH / SORT / CLOZE (drag) */
.chip{touch-action:none;cursor:grab}
.chip.dragging{opacity:.3}
.dragghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.05);box-shadow:0 14px 24px rgba(0,0,0,.3)!important}
.zone.hover{outline:3px dashed var(--sun);outline-offset:3px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px;padding:10px;border-radius:18px;background:var(--soft);width:100%;max-width:980px}
.bank .tile{font-size:clamp(15px,1.8vw,21px);padding:9px 14px}
.mrows{display:grid;gap:10px;width:100%;max-width:860px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.slot{border-radius:16px;border:3px dashed var(--soft);background:var(--soft);min-height:58px;display:flex;align-items:center;justify-content:center;padding:4px}
.slot .tile{width:100%;box-shadow:0 3px 0 var(--edge)}
.bins{display:grid;gap:12px;width:100%;max-width:1000px}
.bin{border-radius:20px;background:var(--soft);padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.bin h3{font-size:22px;text-align:center;padding:6px;border-radius:12px;background:var(--tile);color:var(--tileInk);box-shadow:0 4px 0 var(--edge)}
.bin .items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin .items .tile{font-size:16px;padding:6px 10px;box-shadow:0 3px 0 var(--edge)}
.clozetext{background:var(--tile);color:var(--tileInk);border-radius:20px;padding:22px 26px;font-size:clamp(18px,2.2vw,25px);line-height:2.2;max-width:900px;width:100%;box-shadow:0 6px 0 var(--edge)}
.gap{display:inline-flex;min-width:110px;min-height:42px;vertical-align:middle;border-radius:10px;border:3px dashed #b9bede;background:#f3f4fb;margin:0 3px;padding:0 4px;align-items:center;justify-content:center;line-height:1.2}
.gap .tile{font-size:inherit;padding:4px 10px;box-shadow:0 3px 0 var(--edge)}
.gap.good{border:3px solid #22b07d;background:#e3f8ef}.gap.bad{border:3px solid #ef4f5f;background:#ffe9eb;animation:shake .4s}

/* LETTER GAMES */
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lslot{width:clamp(38px,5.4vw,60px);height:clamp(46px,6.4vw,70px);border-radius:12px;background:var(--soft);border:3px solid rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:clamp(22px,3.4vw,38px);color:var(--fg)}
.lslot.f{background:var(--tile);color:var(--tileInk);border-color:transparent;box-shadow:0 4px 0 var(--edge)}
.lslot.sp{background:none;border:0;width:16px}
.lslot.good{background:#22b07d;color:#fff;border-color:transparent}
.letters{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.letters .tile{width:clamp(44px,5.6vw,64px);height:clamp(48px,6vw,68px);padding:0;font-size:clamp(22px,3.2vw,34px)}
.kbd{display:flex;flex-direction:column;gap:7px;align-items:center;width:100%;max-width:760px}
.kbd div{display:flex;gap:6px;justify-content:center;width:100%}
.kbd .tile{flex:1;max-width:58px;height:52px;padding:0;font-size:22px}
.kbd .tile.used{opacity:.25;pointer-events:none}
.balloons{display:flex;gap:6px;justify-content:center;min-height:86px;align-items:flex-end}
.balloon{width:44px;height:56px;border-radius:50% 50% 48% 52%/55% 55% 45% 45%;position:relative;animation:bob 2.4s ease-in-out infinite;transition:transform .2s,opacity .2s}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:26px;background:rgba(255,255,255,.5)}
.balloon.popd{transform:scale(1.6);opacity:0}
@keyframes bob{50%{transform:translateY(-8px)}}

/* WORDSEARCH */
.wsbox{display:flex;gap:22px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
.wsgrid{display:grid;background:var(--tile);border-radius:18px;padding:10px;box-shadow:0 6px 0 var(--edge);touch-action:none;gap:2px}
.wsc{width:clamp(22px,min(4.4vw,5vh),44px);height:clamp(22px,min(4.4vw,5vh),44px);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:clamp(14px,min(2.6vw,3vh),26px);color:var(--tileInk);border-radius:8px}
.wsc.hl{background:var(--sun);color:#3b2a00}
.wsc.f0{background:#ffb3c4}.wsc.f1{background:#a6defb}.wsc.f2{background:#ffe08f}.wsc.f3{background:#a3ebc9}.wsc.f4{background:#d3c2ff}.wsc.f5{background:#ffc7a6}
.wslist{display:flex;flex-direction:column;gap:6px;min-width:150px}
.wslist span{font-family:var(--disp);font-weight:700;font-size:20px;padding:4px 12px;border-radius:10px;background:var(--soft)}
.wslist span.found{text-decoration:line-through;opacity:.5}

/* CROSSWORD */
.cwbox{display:flex;gap:22px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
.cwgrid{display:grid;gap:3px}
.cwc{width:clamp(26px,min(4vw,5vh),42px);height:clamp(26px,min(4vw,5vh),42px);position:relative}
.cwc.l{background:var(--tile);border-radius:7px;box-shadow:0 3px 0 var(--edge)}

/* ICÔNES VECTORIELLES ANIMÉES */
.ico{display:inline-block;line-height:0;flex:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

.ico .k-pin{transform-origin:50% 100%}

.shelf .ico:nth-child(5){animation-delay:.28s}.shelf .ico:nth-child(6){animation-delay:.35s}.shelf .ico:nth-child(7){animation-delay:.42s}.shelf .ico:nth-child(8){animation-delay:.49s}

<script>
'use strict';
/* ===== UTILITAIRES ===== */
function isArr(x){return Object.prototype.toString.call(x)==='[object Array]';}
function add(el,kids){
  if(kids==null||kids===false)return el;
  if(!isArr(kids))kids=[kids];
  for(var i=0;i<kids.length;i++){var c=kids[i];
    if(c==null||c===false)continue;
    if(isArr(c))add(el,c);
    else el.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));}
  return el;
}
function h(tag,attrs,kids){
  var el=document.createElement(tag);
  if(attrs){for(var k in attrs){if(!attrs.hasOwnProperty(k))continue;var v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='style')el.style.cssText=v;
    else if(k==='html')el.innerHTML=v;
    else if(k==='text')el.textContent=v;
    else if(k==='value')el.value=v;
    else if(k.indexOf('on')===0&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);}}
  return add(el,kids);
}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function clone(x){return JSON.parse(JSON.stringify(x));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function txt(s){return String(s==null?'':s).replace(/\s+/g,' ').trim();}
function extend(a,b){for(var k in b)if(b.hasOwnProperty(k))a[k]=b[k];return a;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function noAccent(s){
  s=String(s);
  if(s.normalize)return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return s;
}
function lettersOnly(s){return noAccent(String(s).toUpperCase()).replace(/[^A-Z]/g,'');}
function sameAnswer(a,b){return noAccent(txt(a).toLowerCase()).replace(/[’']/g,"'")===noAccent(txt(b).toLowerCase()).replace(/[’']/g,"'");}
function uniq(arr){var o={},r=[];arr.forEach(function(x){var k=txt(x).toLowerCase();if(k&&!o[k]){o[k]=1;r.push(x);}});return r;}
function pick(arr,n){return shuffle(arr).slice(0,n);}
function rep(s,n){var r='';for(var i=0;i<n;i++)r+=s;return r;}
function later(fn,ms){return setTimeout(fn,ms);}
function toast(msg){var t=$('#toast');t.textContent=msg;t.className='on';clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='';},2600);}
function fmtTime(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60);var r=s%60;return m+':'+(r<10?'0':'')+r;}

/* ===== PRÉFÉRENCES ===== */
var PREFKEY='brot2you_studio_v5_prefs';
var PREFS={sound:true,music:false,vol:0.8};
try{extend(PREFS,JSON.parse(localStorage.getItem(PREFKEY)||'{}'));}catch(e){}
function savePrefs(){try{localStorage.setItem(PREFKEY,JSON.stringify(PREFS));}catch(e){}}

/* ===== SONS (synthèse soignée, aucun fichier) ===== */
var SFX={ctx:null,out:null,rev:null,
  init:function(){
    if(!this.ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{this.setup(new C());}catch(e){return null;}}
    if(this.ctx.state==='suspended')try{this.ctx.resume();}catch(e){}
    return this.ctx;},
  setup:function(c){
    this.ctx=c;var comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
    this.out=c.createGain();this.out.gain.value=PREFS.vol==null?0.8:PREFS.vol;this.out.connect(comp);comp.connect(c.destination);
    var len=Math.floor(c.sampleRate*1.4),ir=c.createBuffer(2,len,c.sampleRate);
    for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    var conv=c.createConvolver();conv.buffer=ir;this.rev=c.createGain();this.rev.gain.value=0.22;this.rev.connect(conv);conv.connect(this.out);
    var nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(var j=0;j<nd.length;j++)nd[j]=Math.random()*2-1;this.noiseBuf=nb;
  },
  ok:function(){return PREFS.sound&&this.init();},
  env:function(g,t,vol,att,dec,sus){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002),t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec+(sus||0));},

  var center=h('button',{class:'wcenter',onclick:function(){spin();}},'Tourner');

  var size=300,ctx=cv.getContext('2d');

  function layout(){
    var w=box.clientWidth,hh=S.el.classList.contains('full')?window.innerHeight-90:Math.min(window.innerHeight*0.72,640)-80;size=Math.max(240,Math.min(w-20,hh-30,720));
    var dpr=window.devicePixelRatio||1;cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';ctx.setTransform(dpr,0,0,dpr,0,0);

    }

    S.popup(nodes,btns);

/* ---------- MOTS MÊLÉS ---------- */
function buildSearch(words,diag,rev){
  var longest=0,total=0;words.forEach(function(w){longest=Math.max(longest,w.length);total+=w.length;});
  var N=clamp(Math.max(longest+1,Math.ceil(Math.sqrt(total*2.3))),8,16);
  var dirs=[[0,1],[1,0]];if(diag)dirs.push([1,1],[-1,1]);if(rev){dirs=dirs.concat(dirs.map(function(d){return [-d[0],-d[1]];}));}
  var best=null;
  for(var att=0;att<25;att++){
    var g=[];for(var r=0;r<N;r++){g.push([]);for(var c=0;c<N;c++)g[r].push('');}
    var placed=[];
    shuffle(words).sort(function(x,y){return y.length-x.length;}).forEach(function(w){
      for(var t=0;t<300;t++){var d=dirs[Math.floor(Math.random()*dirs.length)];var r0=Math.floor(Math.random()*N),c0=Math.floor(Math.random()*N);
        var r1=r0+d[0]*(w.length-1),c1=c0+d[1]*(w.length-1);if(r1<0||r1>=N||c1<0||c1>=N)continue;var ok=true;
        for(var k=0;k<w.length;k++){var ch=g[r0+d[0]*k][c0+d[1]*k];if(ch&&ch!==w[k]){ok=false;break;}}
        if(!ok)continue;for(k=0;k<w.length;k++)g[r0+d[0]*k][c0+d[1]*k]=w[k];placed.push({w:w,r:r0,c:c0,d:d});return;}
    });
    if(!best||placed.length>best.placed.length)best={g:g,placed:placed};if(placed.length===words.length)break;
  }
  var AL='ABCDEFGHIJKLMNOPRSTUVWY';
  best.g.forEach(function(row){for(var c=0;c<N;c++)if(!row[c])row[c]=AL[Math.floor(Math.random()*AL.length)];});
  best.N=N;return best;
}
GAMES.wordsearch=function(S,a){

  var B=buildSearch(list,S.opt('diag',true),S.opt('rev',false));var N=B.N,found=0,colorI=0;
  var words=B.placed.map(function(p){return p.w;});

  function path(a0,b0){var dr=b0._r-a0._r,dc=b0._c-a0._c;var n=Math.max(Math.abs(dr),Math.abs(dc));if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return [a0];var sr=n?dr/n:0,sc=n?dc/n:0,p=[];for(var k=0;k<=n;k++)p.push(cells[a0._r+sr*k][a0._c+sc*k]);return p;}

    for(var k=0;k<words.length;k++){var w=words[k];if(!spans[w].classList.contains('found')&&(w===s||w===r)&&p.length===w.length){var cl='f'+(colorI++%6);p.forEach(function(x){x.classList.add(cl);});spans[w].classList.add('found');found++;S.progress(found,words.length);S.score(found+' / '+words.length);SFX.good();
      if(found===words.length)S.later(function(){S.finish({correct:found,total:words.length,time:S.stopClock()});},500);return true;}}
    if(p.length>1)SFX.bad();return false;}
  grid.addEventListener('pointerdown',function(e){var c=cellAt(e.clientX,e.clientY);if(!c)return;e.preventDefault();

function buildCross(entries){
  var best=null;
  for(var att=0;att<40;att++){
    var order=att===0?entries.slice().sort(function(x,y){return y.L.length-x.L.length;}):shuffle(entries).sort(function(x,y){return (y.L.length-x.L.length)+(Math.random()-.5)*4;});
    var G={},D={},pl=[],inter=0;

function readImage(file,maxSide,cb){
  if(!file||!/^image\//.test(file.type)){toast('Ce fichier n’est pas une image.');return;}
  var fr=new FileReader();
  fr.onload=function(){
    if(file.type==='image/gif'||file.type==='image/svg+xml'){if(fr.result.length>900000){toast('Image trop lourde (900 Ko max pour un GIF/SVG).');return;}cb(fr.result);return;}
    var im=new Image();im.onload=function(){
      var s=Math.min(1,maxSide/Math.max(im.width,im.height));var w=Math.round(im.width*s),hh=Math.round(im.height*s);
      var cv=document.createElement('canvas');cv.width=w;cv.height=hh;var cx=cv.getContext('2d');
      var png=file.type==='image/png'&&file.size<250000;if(!png){cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);}
      cx.drawImage(im,0,0,w,hh);cb(cv.toDataURL(png?'image/png':'image/jpeg',0.82));};
    im.onerror=function(){toast('Image illisible.');};im.src=fr.result;};
  fr.readAsDataURL(file);
}

    h('p',{class:'muted',style:'font-size:13px;margin-bottom:0'},'Conseil : 1 à 3 secondes suffisent. Chaque son pèse environ 10 à 25 Ko.')]);

  if(parts[0]==='jouer'){var b=getAct(parts[1]);if(!b){location.hash='#/';return;}return viewPlay(b,false);}
  if(parts[0]==='p'||parts[0]==='e'){var c=null;try{c=unpackAct(hsh.slice(2));}catch(e){}
    if(!c||!c.template){VIEW.innerHTML='';add(VIEW,h('div',{class:'empty'},[h('h2',null,'Lien incomplet'),h('p',null,'Ce lien a été coupé en route. Demande à ton professeur de te le renvoyer.')]));return;}
